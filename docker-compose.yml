services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cavfleet
      POSTGRES_PASSWORD: cavfleet
      POSTGRES_DB: cavfleet
    ports:
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  nats-data:
  pg-data:
